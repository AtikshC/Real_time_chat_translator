<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Private Chat Translator</title>
  <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
    <h1 class="text-2xl font-semibold mb-4">Private Chat Translator</h1>
    <div class="mb-4 space-y-2">
      <div>
        <label class="block text-sm font-medium">Username</label>
        <input id="username" type="text" value="User"
               class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div>
        <label class="block text-sm font-medium">Translate to</label>
        <select id="lang"
                class="mt-1 block w-full border border-gray-300 rounded-md p-2">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="hi">Hindi</option>
          <option value="de">German</option>
          <option value="zh-cn">Chinese (Simplified)</option>
          <option value="ja">Japanese</option>
          <option value="ru">Russian</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium">Send to</label>
        <input id="target" type="text" placeholder="Recipient username"
               class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
      </div>
    </div>
    <div id="chat"
         class="h-64 overflow-auto border border-gray-200 rounded-md p-3 mb-4 bg-gray-50"></div>
    <div class="flex space-x-2">
      <input id="message" autocomplete="off" placeholder="Type a message…"
             class="flex-grow border border-gray-300 rounded-md p-2" />
      <button id="send"
              class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
        Send
      </button>
    </div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
